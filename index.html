<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário Automático</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>📦 Inventário Automático</h1>
  </header>

  <section class="upload">
    <h2>📂 Upload da Planilha Excel</h2>
    <input type="file" id="upload" accept=".xlsx,.xls">
    <p id="statusUpload">Nenhuma planilha carregada.</p>
  </section>

  <section class="pesquisa">
    <h2>🔍 Pesquisa</h2>
    <textarea id="ids" placeholder="Digite IDs separados por vírgula, espaço ou quebra de linha"></textarea>

    <div class="categoria">
      <label><input type="radio" name="categoria" value="IN HOME" checked> IN HOME</label>
      <label><input type="radio" name="categoria" value="LABORATÓRIO"> LABORATÓRIO</label>
    </div>

    <button id="adicionar">Adicionar IDs</button>
  </section>

  <section class="inventario">
    <h2>📊 Inventário acumulado</h2>
    <div id="contador"></div>
    <table id="tabela">
      <thead>
        <tr>
          <th>ID</th>
          <th>Código</th>
          <th>Descrição</th>
          <th>Referência Uso</th>
          <th>OS Fabricante</th>
          <th>Status garantia</th>
          <th>Status peça garantia</th>
          <th>Recebimento UPC</th>
          <th>Modelo Principal</th>
          <th>Categoria</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button id="baixar">⬇️ Baixar Inventário (Excel)</button>
    <button id="limpar">🗑️ Limpar Inventário</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
